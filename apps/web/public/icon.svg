<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14110E" />
      <stop offset="50%" stop-color="#090909" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>

    <!-- Metallic Glowing Gold / Bronze Gradient -->
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D6" />
      <stop offset="25%" stop-color="#F2D7B6" />
      <stop offset="50%" stop-color="#C98A4A" />
      <stop offset="75%" stop-color="#A2662C" />
      <stop offset="100%" stop-color="#5A3A17" />
    </linearGradient>

    <!-- Accent Emerald Gradient for Live Candlestick -->
    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#3EDC81" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Obsidian Base with Subtle Border -->
  <rect width="512" height="512" rx="64" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="60" fill="none" stroke="url(#bronzeGrad)" stroke-width="6" opacity="0.85" />

  <!-- Geometric Ambient Grid Facets -->
  <g opacity="0.15" stroke="#C98A4A" stroke-width="1.5">
    <line x1="64" y1="128" x2="448" y2="128" />
    <line x1="64" y1="256" x2="448" y2="256" />
    <line x1="64" y1="384" x2="448" y2="384" />
    <line x1="128" y1="64" x2="128" y2="448" />
    <line x1="256" y1="64" x2="256" y2="448" />
    <line x1="384" y1="64" x2="384" y2="448" />
  </g>

  <!-- Glowing Emblem: Interlocking IV Geometric Shield -->
  <g filter="url(#goldGlow)">
    <!-- Outer Octagonal Ring -->
    <polygon points="256,56 420,120 456,284 350,424 256,456 162,424 56,284 92,120" 
             fill="none" 
             stroke="url(#bronzeGrad)" 
             stroke-width="10" 
             stroke-linejoin="miter" />

    <!-- Left Candlestick Pillar (I) -->
    <line x1="168" y1="140" x2="168" y2="372" stroke="url(#bronzeGrad)" stroke-width="4" stroke-linecap="round" />
    <rect x="150" y="180" width="36" height="150" rx="4" fill="url(#bronzeGrad)" />

    <!-- Center Dynamic Ascending Surge (Candlestick Vector) -->
    <line x1="256" y1="100" x2="256" y2="380" stroke="#3EDC81" stroke-width="5" stroke-linecap="round" />
    <rect x="238" y="150" width="36" height="170" rx="4" fill="url(#emeraldGrad)" />

    <!-- Right Pillar & Angular V-Bracket -->
    <line x1="344" y1="140" x2="344" y2="372" stroke="url(#bronzeGrad)" stroke-width="4" stroke-linecap="round" />
    <rect x="326" y="210" width="36" height="120" rx="4" fill="url(#bronzeGrad)" />

    <!-- Intersecting Chevron Arrow representing breakout trajectory -->
    <polyline points="150,330 256,150 362,330" fill="none" stroke="url(#bronzeGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Inner Sparkle Accents -->
  <circle cx="256" cy="100" r="7" fill="#FFFFFF" />
  <circle cx="168" cy="140" r="5" fill="#F2D7B6" />
  <circle cx="344" cy="140" r="5" fill="#F2D7B6" />
</svg>
